spring.application.name=payment_service
server.port=8083


spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group_id=payment-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.springDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.springDeserializer
