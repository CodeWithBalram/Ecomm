spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/products/** ,/categories/**

            - id: order-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**

            - id: payment-service-route
              uri: http://localhost:8083
              predicates:
                - Path=/payments/**